[package]
name = "comiconv"
version = "0.4.0"
edition = "2024"
authors = ["Chrontax"]
description = "A command line tool to convert comic book archives to other formats."
readme = "README.md"
homepage = "https://github.com/chrontax/comiconv"
repository = "https://github.com/chrontax/comiconv"
license = "Apache-2.0 OR MIT"
keywords = ["comic", "convert", "cbz", "cbt", "cb7"]
categories = ["command-line-utilities", "encoding"]

[dependencies]
clap = { version = "4.6.6", features = ["cargo"] }
image = { version = "0.25.10", default-features = false, features = [
  "png",
  "webp",
  "jpeg",
  "gif",
] }
indicatif = "0.18.6"
libavif-image = "0.14.0"
rayon = "1.12.0"
sha2 = "0.11.0"
cra = "0.1.4"
thiserror = "2.0.20"
jxl-oxide = { version = "0.12.6", features = ["image"] }
infer = "0.22.0"
zune-jpegxl = "0.5.2"
zune-core = "0.5.3"
libavif = "0.14.0"
axum = { version = "0.8", features = ["multipart"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
percent-encoding = "2.3.2"

[lib]
path = "src/lib.rs"

[[bin]]
path = "src/main.rs"
name = "comiconv"

[[bin]]
path = "src/web.rs"
name = "comiconv-web"
